name: Quality

on:
  workflow_call:
    inputs:
      documentation_range:
        required: false
        type: string
  pull_request:
  push:
    branches: [main, 'feature/**', 'fix/**', 'codex/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Require documentation for application changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          DOCUMENTATION_RANGE: ${{ inputs.documentation_range }}
        run: |
          if [ -n "$DOCUMENTATION_RANGE" ]; then
            scripts/check-documentation.sh "$DOCUMENTATION_RANGE"
          elif [ "$EVENT_NAME" = pull_request ]; then
            scripts/check-documentation.sh "origin/$BASE_REF...HEAD"
          elif [ "$REF_NAME" != main ]; then
            scripts/check-documentation.sh "origin/main...$SHA"
          elif [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            scripts/check-documentation.sh "$BEFORE..$SHA"
          fi
