name: Production support

on:
  push:
    branches: [main]

concurrency:
  group: production-support-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate public production health
        env:
          DEPLOYMENT_API_URL: https://api-production-f10dd.up.railway.app
          DEPLOYMENT_ENVIRONMENT: production
        run: python scripts/check-production.py --timeout-seconds 600 --interval-seconds 60 >> "$GITHUB_STEP_SUMMARY"
      - name: Inspect Railway failure logs
        if: ${{ env.RAILWAY_TOKEN != '' }}
        env:
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
        run: |
          npx --yes @railway/cli@latest logs --project "$RAILWAY_PROJECT_ID" --environment production --service api --since 20m --lines 200 --json > "$RUNNER_TEMP/api-errors.json"
          npx --yes @railway/cli@latest logs --project "$RAILWAY_PROJECT_ID" --environment production --service engine --since 20m --lines 200 --json > "$RUNNER_TEMP/engine-errors.json"
          if grep -Eq 'engine_cycle_failed|engine_unavailable|engine_timeout|Traceback|ERROR:|Exception in ASGI application' "$RUNNER_TEMP/api-errors.json" "$RUNNER_TEMP/engine-errors.json"; then
            echo 'Railway reported an application failure after deployment.' >&2
            exit 1
          fi
      - name: Upload Railway diagnostics
        if: ${{ always() && env.RAILWAY_TOKEN != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: production-railway-diagnostics
          path: ${{ runner.temp }}/*-errors.json
          if-no-files-found: ignore
