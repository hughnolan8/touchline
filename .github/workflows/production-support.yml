name: Production support

on:
  push:
    branches: [main]

concurrency:
  group: production-support-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate public production health
        env:
          PRODUCTION_API_URL: https://api-production-f10dd.up.railway.app
        run: python scripts/check-production.py --timeout-seconds 600 --interval-seconds 60 >> "$GITHUB_STEP_SUMMARY"
