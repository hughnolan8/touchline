name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Skips until the repo variable FLY_ENABLED=true is set (after first `fly launch`).
    if: ${{ vars.FLY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Health check
        run: |
          app=$(sed -nE "s/^app = ['\"]([^'\"]+)['\"].*/\1/p" fly.toml)
          for i in 1 2 3 4 5 6; do
            curl -fsS "https://$app.fly.dev/health" && exit 0
            sleep 10
          done
          exit 1
