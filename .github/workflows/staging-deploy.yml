name: Staging deploy

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: shared-staging
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (startsWith(github.event.workflow_run.head_branch, 'feature/') ||
       startsWith(github.event.workflow_run.head_branch, 'fix/') ||
       startsWith(github.event.workflow_run.head_branch, 'codex/'))
    runs-on: ubuntu-latest
    environment: staging
    strategy:
      matrix:
        service: [api, engine]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Deploy ${{ matrix.service }} to shared staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
        run: npx --yes @railway/cli@latest up --ci --project "$RAILWAY_PROJECT_ID" --environment staging --service "${{ matrix.service }}"
  start-engine:
    needs: deploy
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Start a staging engine cycle
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
        run: npx --yes @railway/cli@latest ssh --project "$RAILWAY_PROJECT_ID" --environment staging --service engine -- python -m backend.runner --once
  validate:
    needs: start-engine
    uses: ./.github/workflows/staging-support.yml
    with:
      sha: ${{ github.event.workflow_run.head_sha }}
      branch: ${{ github.event.workflow_run.head_branch }}
    secrets: inherit
  report-deploy-failure:
    needs: [deploy, start-engine]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Report failed staging deployment
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=failure -f context=validate -f description='Staging deployment failed'
