# Single machine: web UI + in-process scheduler + SQLite on a volume.
# First-time setup is in docs/features/deployment.md.
app = "touchline"
primary_region = "lhr"

[build]

[env]
  TOUCHLINE_DB = "/data/touchline.sqlite3"
  ODDS_MAX_REQUESTS_PER_DAY = "40"

[mounts]
  source = "touchline_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # the scheduler must keep running
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
