# fly.toml app configuration file generated for touchline-frosty-pine-4823 on 2026-11-19T03:27:24Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'touchline-frosty-pine-4823'
primary_region = 'lhr'
# Disk-backed swap (free) so a one-off `touchline backfill` over SSH slows down instead of OOMing.
swap_size_mb = 512

[build]
[env]
  # Free Odds API plan = 500 credits/month: 16/day x 31 days, no background refresh.
  ODDS_MAX_REQUESTS_PER_DAY = '16'
  ODDS_REFRESH_HOURS = '8760'
  ODDS_CLOSING_REFRESH = '0'
  TOUCHLINE_DB = '/data/touchline.sqlite3'

[[mounts]]
  source = 'touchline_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  # 256MB keeps the bill under Fly's $5/month waiver; the app peaks around 150MB.
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
